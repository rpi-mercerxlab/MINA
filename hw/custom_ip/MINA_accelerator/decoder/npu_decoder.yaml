entity_name: npu_decoder
instruction_width: 36

fields:
  OPCODE: "35 downto 28"
  DMA_OP_CODE: "27 downto 24"

  PE_SOURCE_FIELD: "27 downto 26"
  PE_DATA_START_ADDR: "25 downto 14"
  PE_WEIGHT_START_ADDR: "13 downto 2"

  PE_DRAIN_START_ADDR: "27 downto 16"

  INT_TARG_ADDR: "27 downto 16"

  JUMP_ADDR: "27 downto 18"

control_signals:
  pe_reset: { width: 1, default: "'0'" }
  pe_run: { width: 1, default: "'0'" }
  pe_drain: { width: 1, default: "'0'" }
  pe_data_source: { width: 2, default: '"00"' }
  pe_data_addr: { width: 12, default: '"000000000000"' }
  pe_weight_addr: { width: 12, default: '"000000000000"' }
  pe_drain_addr: { width: 12, default: '"000000000000"' }

  trigger_interrupt: { width: 1, default: "'0'" }
  vo_int_addr: { width: 1, default: "'0'" }
  int_targ_addr: { width: 12, default: '"000000000000"' }

  jump_addr_vo: { width: 1, default: "'0'" }
  jump_addr: { width: 10, default: '"0000000000"' }

status_inputs:
  pe_drive_done: 1
  pe_drain_done: 1

decode_tree:
  field: OPCODE
  cases:
    "0x00": #drive pe, param1: pe source field, param2: data start addr, param 3: weight start addr
      set:
        #control signals and address routing
        pe_run: "'1'"
        pe_data_source: "@PE_SOURCE_FIELD"
        pe_data_addr: "@PE_DATA_START_ADDR"
        pe_weight_addr: "@PE_WEIGHT_START_ADDR"

      wait_for: pe_drive_done
    "0x01": #reset
      set:
        pe_reset: "'0'"
    "0x02": #drain pe, to target addr
      set:
        pe_drain: "'1'"
        pe_drain_addr: "@PE_DRAIN_START_ADDR"
      wait_for: pe_drain_done
    "0x03": #top level interrupt, triggers the top level interrupt
      set:
        #to interrupt module
        trigger_interrupt: "'1'"
    "0x04": #top_level_output_addr
      set:
        vo_int_addr: "'1'"
        int_targ_addr: "@INT_TARG_ADDR"
    "0x05": #jump instruction
      set:
        jump_addr_vo: "'1'"
        jump_addr: "@JUMP_ADDR"
    "0x06": #DMA decode tree
      match:
        field: DMA_OP_CODE
